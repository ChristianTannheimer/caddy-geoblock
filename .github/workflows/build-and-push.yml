name: Build and Push Caddy with MaxMind GeoIP

on:
  schedule:
    - cron: '37 4 * * *'   # täglich 04:37 UTC, baut aber nur bei Änderungen
  workflow_dispatch:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: christiantannheimer/caddy-geoblock

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for updates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${GH_TOKEN}"

          CADDY_LATEST=$(curl -sL -H "$AUTH" \
            "https://api.github.com/repos/caddyserver/caddy/releases/latest" | jq -r .tag_name)
          MM_LATEST=$(curl -sL -H "$AUTH" \
            "https://api.github.com/repos/porech/caddy-maxmind-geolocation/commits" \
            | jq -r '.[0].sha' | cut -c1-7)

          # Sanity-Check: leere Werte deuten auf Rate-Limit hin
          if [ -z "$CADDY_LATEST" ] || [ "$CADDY_LATEST" = "null" ] \
             || [ -z "$MM_LATEST" ] || [ "$MM_LATEST" = "null" ]; then
            echo "API-Abfrage fehlgeschlagen (Rate-Limit?). Abbruch."
            exit 1
          fi

          VERSION_TAG="${CADDY_LATEST}-mm-${MM_LATEST}"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "Prüfe Version: ${VERSION_TAG}"

          if docker manifest inspect \
             "ghcr.io/${IMAGE_NAME}:${VERSION_TAG}" > /dev/null 2>&1; then
            echo "Keine Änderungen. Image existiert bereits."
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Neue Version gefunden. Starte Build."
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.check.outputs.build_needed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: steps.check.outputs.build_needed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.check.outputs.version_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
